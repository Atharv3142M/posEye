[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin-orchestrator"
version = "0.1.5"
description = "FastAPI job orchestrator for NodeODM + Stage 1 extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psutil>=6.0",
  "trimesh>=4.4",
  "pygltflib>=1.16",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dt-orchestrator = "orchestrator.main:run"
dt-nodeodm = "orchestrator.nodeodm:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../pipeline/src"]
