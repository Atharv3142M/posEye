name: posEye CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    name: Pipeline & Orchestrator Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            apps/pipeline/pyproject.toml
            apps/orchestrator/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e apps/pipeline
          pip install -e apps/orchestrator
          pip install pytest httpx pyinstaller

      - name: Provision FFmpeg
        run: |
          choco install ffmpeg --no-progress
          powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1
          $ffmpegDir = (Resolve-Path "third_party").Path
          $ffmpegExe = (Resolve-Path "third_party\ffmpeg.exe").Path
          echo "$ffmpegDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "FFMPEG_PATH=$ffmpegExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: FFmpeg Preflight Diagnostic
        run: |
          ffmpeg -version
          if (-not (Test-Path "third_party\ffmpeg.exe")) {
            Write-Error "CRITICAL: FFmpeg was not provisioned at third_party\ffmpeg.exe"
            exit 1
          }
          Write-Host "FFmpeg successfully provisioned and verified at: third_party\ffmpeg.exe"

      - name: Run Pytest Suite
        run: |
          pytest apps/pipeline apps/orchestrator -v --durations=10

  desktop-build:
    name: Desktop TypeScript, Vite & Electron NSIS Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for Orchestrator Build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e apps/pipeline
          pip install -e apps/orchestrator
          pip install pyinstaller

      - name: Build Standalone posEye.Orchestrator.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-orchestrator.ps1
          if (-not (Test-Path "third_party\posEye.Orchestrator.exe")) {
            Write-Error "CRITICAL: posEye.Orchestrator.exe was not created in third_party/"
            exit 1
          }
          Write-Host "Verified posEye.Orchestrator.exe build at: third_party\posEye.Orchestrator.exe"

      - name: Provision FFmpeg for Packaging
        run: |
          choco install ffmpeg --no-progress
          powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1
          if (-not (Test-Path "third_party\ffmpeg.exe")) {
            Write-Error "CRITICAL: ffmpeg.exe was not provisioned in third_party/"
            exit 1
          }

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Clean install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Desktop Security Unit Tests
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck TypeScript
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Build React Vite Bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Verify Electron App Packaging (win-unpacked)
        working-directory: apps/desktop
        run: npx electron-builder --win --dir

      - name: Build Production NSIS Installer
        working-directory: apps/desktop
        run: npm run dist

      - name: Verify Installer Artifact
        id: verify_installer
        run: |
          $pkg = Get-Content "apps/desktop/package.json" | ConvertFrom-Json
          $version = $pkg.version
          Write-Host "Detected package version: $version"
          $installerPath = "apps/desktop/release/posEye.Setup.$version.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "CRITICAL: Expected installer not found at $installerPath"
            Get-ChildItem -Path "apps/desktop/release" | Format-Table Name, Length
            exit 1
          }
          $installer = Get-Item $installerPath
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Installer created: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "SHA-256: $hash"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Generate build manifest
          $manifest = @{
            version = $version
            filename = $installer.Name
            bytes = $installer.Length
            sha256 = $hash
            builtAt = (Get-Date -Format "o")
          } | ConvertTo-Json
          $manifest | Set-Content -Path "apps/desktop/release/build-manifest.json" -Encoding utf8

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: posEye-Windows-Installer-v${{ steps.verify_installer.outputs.version }}
          path: |
            ${{ steps.verify_installer.outputs.installer_path }}
            apps/desktop/release/build-manifest.json
          if-no-files-found: error
